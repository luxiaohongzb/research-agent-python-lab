x-runtime-environment: &runtime-environment
  RESEARCH_AGENT_PROVIDER_MODE: ${RESEARCH_AGENT_PROVIDER_MODE:-offline}
  RESEARCH_AGENT_REASONER_MODE: ${RESEARCH_AGENT_REASONER_MODE:-deterministic}
  RESEARCH_AGENT_MODEL: ${RESEARCH_AGENT_MODEL:-gpt-5-mini}
  RESEARCH_AGENT_DEEPSEEK_MODEL: ${RESEARCH_AGENT_DEEPSEEK_MODEL:-deepseek-v4-pro}
  RESEARCH_AGENT_DEEPSEEK_BASE_URL: ${RESEARCH_AGENT_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  RESEARCH_AGENT_MODEL_TIMEOUT_SECONDS: ${RESEARCH_AGENT_MODEL_TIMEOUT_SECONDS:-60}
  RESEARCH_AGENT_MODEL_MAX_RETRIES: ${RESEARCH_AGENT_MODEL_MAX_RETRIES:-3}
  RESEARCH_AGENT_MODEL_MAX_CONCURRENCY: ${RESEARCH_AGENT_MODEL_MAX_CONCURRENCY:-3}
  RESEARCH_AGENT_PROGRESS_HEARTBEAT_SECONDS: ${RESEARCH_AGENT_PROGRESS_HEARTBEAT_SECONDS:-10}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  RESEARCH_AGENT_INDEX_MODE: postgres
  RESEARCH_AGENT_CHECKPOINT_MODE: postgres
  RESEARCH_AGENT_RUN_STORE_MODE: postgres
  RESEARCH_AGENT_EVENT_BROKER_MODE: redis
  RESEARCH_AGENT_DISPATCH_MODE: redis
  RESEARCH_AGENT_CANCELLATION_MODE: redis
  RESEARCH_AGENT_ARTIFACT_STORE_MODE: s3
  RESEARCH_AGENT_AUTH_MODE: ${RESEARCH_AGENT_AUTH_MODE:-disabled}
  RESEARCH_AGENT_API_KEYS_JSON: ${RESEARCH_AGENT_API_KEYS_JSON:-{}}
  RESEARCH_AGENT_IDENTITY_STORE_MODE: ${RESEARCH_AGENT_IDENTITY_STORE_MODE:-auto}
  RESEARCH_AGENT_AUTH_TOKEN_SECRET: ${RESEARCH_AGENT_AUTH_TOKEN_SECRET:-}
  RESEARCH_AGENT_AUTH_ACCESS_TOKEN_SECONDS: ${RESEARCH_AGENT_AUTH_ACCESS_TOKEN_SECONDS:-900}
  RESEARCH_AGENT_AUTH_REFRESH_TOKEN_SECONDS: ${RESEARCH_AGENT_AUTH_REFRESH_TOKEN_SECONDS:-2592000}
  RESEARCH_AGENT_AUTH_MAX_FAILED_ATTEMPTS: ${RESEARCH_AGENT_AUTH_MAX_FAILED_ATTEMPTS:-5}
  RESEARCH_AGENT_AUTH_LOCKOUT_SECONDS: ${RESEARCH_AGENT_AUTH_LOCKOUT_SECONDS:-900}
  RESEARCH_AGENT_BOOTSTRAP_ADMIN_TENANT_ID: ${RESEARCH_AGENT_BOOTSTRAP_ADMIN_TENANT_ID:-}
  RESEARCH_AGENT_BOOTSTRAP_ADMIN_EMAIL: ${RESEARCH_AGENT_BOOTSTRAP_ADMIN_EMAIL:-}
  RESEARCH_AGENT_BOOTSTRAP_ADMIN_PASSWORD: ${RESEARCH_AGENT_BOOTSTRAP_ADMIN_PASSWORD:-}
  RESEARCH_AGENT_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${RESEARCH_AGENT_BOOTSTRAP_ADMIN_DISPLAY_NAME:-System Administrator}
  RESEARCH_AGENT_TENANT_MAX_ACTIVE_RUNS: ${RESEARCH_AGENT_TENANT_MAX_ACTIVE_RUNS:-5}
  RESEARCH_AGENT_MCP_ENABLED: ${RESEARCH_AGENT_MCP_ENABLED:-false}
  RESEARCH_AGENT_MCP_PAPER_SERVERS_JSON: ${RESEARCH_AGENT_MCP_PAPER_SERVERS_JSON:-[]}
  RESEARCH_AGENT_MCP_TIMEOUT_SECONDS: ${RESEARCH_AGENT_MCP_TIMEOUT_SECONDS:-45}
  MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
  RESEARCH_AGENT_DATABASE_URL: postgresql://research:research@postgres:5432/research_agent
  RESEARCH_AGENT_REDIS_URL: redis://redis:6379/0
  RESEARCH_AGENT_S3_ENDPOINT_URL: http://minio:9000
  RESEARCH_AGENT_S3_BUCKET: research-artifacts
  RESEARCH_AGENT_S3_ACCESS_KEY_ID: minioadmin
  RESEARCH_AGENT_S3_SECRET_ACCESS_KEY: minioadmin
  RESEARCH_AGENT_GROBID_URL: http://grobid:8070
  RESEARCH_AGENT_OTEL_ENABLED: ${RESEARCH_AGENT_OTEL_ENABLED:-false}

x-runtime-dependencies: &runtime-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  api:
    build: .
    image: research-agent-python-lab:local
    ports:
      - "8000:8000"
    environment: *runtime-environment
    depends_on: *runtime-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: research-agent-python-lab:local
    command: ["research-agent-worker"]
    expose:
      - "9100"
    environment: *runtime-environment
    depends_on: *runtime-dependencies

  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    ports:
      - "5432:5432"
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - research_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - research_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  grobid:
    image: grobid/grobid:0.9.0-crf
    ports:
      - "8070:8070"

volumes:
  research_pgdata:
  research_redis:
  research_minio:
